<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100e1a">
<title>月蝕牌室｜抽卡互動試玩</title>
<style>
:root{color-scheme:dark;--ink:#fff8e9;--muted:#b7aecb;--gold:#f2cf87;--pink:#fb9bb5;--line:#ffffff26;--night:#100e1a;--panel:#1c1928}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 9%,#382643 0,#171321 42%,#100e1a 78%);color:var(--ink);font:16px/1.5 system-ui,"Noto Sans TC",sans-serif;overflow-x:hidden}button{font:inherit;color:inherit}.wrap{width:min(1120px,calc(100% - 36px));margin:auto}.top{display:flex;align-items:center;justify-content:space-between;padding:22px 0;border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:.08em}.brand i{font-style:normal;color:var(--gold)}.back{color:var(--muted);text-decoration:none;font-size:14px}.back:hover{color:var(--gold)}main{text-align:center;padding:46px 0 36px}.eyebrow{font-size:12px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}.eyebrow:before,.eyebrow:after{content:"✦";padding:0 12px;opacity:.7}h1{font-family:Georgia,"Noto Serif TC",serif;font-weight:600;font-size:clamp(36px,6vw,62px);letter-spacing:.12em;margin:9px 0 4px}.sub{color:var(--muted);margin:0}.arena{height:clamp(410px,55vw,535px);max-height:535px;position:relative;margin:12px auto 0;overflow:hidden;touch-action:pan-y;user-select:none;cursor:grab}.arena.dragging{cursor:grabbing}.halo{position:absolute;left:50%;bottom:36px;width:min(680px,90vw);height:260px;transform:translateX(-50%);border:1px solid #f2cf8720;border-radius:50%;box-shadow:0 0 75px #c180c20b,inset 0 0 60px #c180c20b;pointer-events:none}.halo:before,.halo:after{content:"";position:absolute;border:1px solid #f2cf8712;border-radius:50%;inset:17px 28px}.halo:after{inset:36px 66px}.cards{position:absolute;inset:0}.card{position:absolute;width:clamp(116px,15vw,154px);height:clamp(176px,22vw,226px);left:50%;top:0;padding:0;border:0;background:transparent;cursor:pointer;transform:translateX(-50%);transform-origin:50% 100%;transition:left .42s cubic-bezier(.2,.8,.2,1),top .42s cubic-bezier(.2,.8,.2,1),transform .34s cubic-bezier(.2,.8,.2,1),filter .3s;will-change:transform;outline:none}.card:hover,.card:focus-visible{z-index:50!important;transform:translateX(-50%) translateY(-27px) scale(1.09)!important;filter:drop-shadow(0 0 18px #f3cc9280)}.card-inner{position:relative;width:100%;height:100%;border-radius:14px;overflow:hidden;background:linear-gradient(145deg,#6d536f,#2a203b 48%,#171520);border:1px solid #e6c48f;box-shadow:0 11px 28px #05040ab0,inset 0 0 0 5px #100e1a,inset 0 0 0 6px #d3ad7444;transition:filter .25s}.card-inner:before{content:"";position:absolute;inset:10px;border:1px solid #eccb884d;border-radius:9px}.card-inner:after{content:"✦";position:absolute;top:11px;left:0;right:0;color:#f8daa0;font-size:13px}.back-design{position:absolute;inset:28px 17px 18px;border:1px solid #f2cf8755;border-radius:50% 50% 10px 10px;background:radial-gradient(ellipse at 50% 43%,#ffdfad20,transparent 48%),repeating-radial-gradient(ellipse at 50% 45%,transparent 0 12px,#f2cf8715 13px 14px);display:grid;place-items:center}.moon{width:50px;height:50px;border-radius:50%;background:var(--gold);box-shadow:14px -5px 0 0 #453451,0 0 30px #f2cf8766;position:relative}.moon:after{content:"✧";position:absolute;color:#fff0c5;font-size:19px;left:-31px;top:-20px}.sigil{position:absolute;bottom:20px;color:#f1d4a0a8;letter-spacing:.42em;font-size:9px}.face{position:absolute;inset:0;display:grid;place-items:center;padding:16px;opacity:0;transform:scale(.76);transition:.35s;backdrop-filter:blur(8px)}.face .symbol{font-size:50px;filter:drop-shadow(0 0 12px #ffdd9d88)}.face strong{position:absolute;bottom:32px;font-size:13px;letter-spacing:.16em;color:#ffe2b0}.card.revealed .card-inner{background:radial-gradient(ellipse at 50% 36%,var(--glow,#d9a1c4) 0%,transparent 58%),linear-gradient(145deg,#382c49,#171521)}.card.revealed .face{opacity:1;transform:scale(1)}.card.revealed .back-design,.card.revealed .sigil{opacity:0}.card.picked .card-inner{box-shadow:0 0 0 2px #f7da9c,0 0 42px #f5c8799c,inset 0 0 0 5px #100e1a}.star{position:absolute;color:#ffe2a3;animation:twinkle 2.6s ease-in-out infinite alternate;pointer-events:none}.s1{left:18%;top:19%;font-size:14px}.s2{right:17%;top:26%;font-size:10px;animation-delay:.7s}.s3{left:28%;top:47%;font-size:8px;animation-delay:1.2s}@keyframes twinkle{to{opacity:.24;transform:scale(.72)}}.controls{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:-5px;position:relative}.draw{border:1px solid #f2d293;background:linear-gradient(135deg,#f4d89f,#c89b61);color:#26192a;padding:13px 29px;border-radius:999px;font-weight:900;letter-spacing:.1em;box-shadow:0 5px 22px #e1b87330;cursor:pointer;transition:.18s}.draw:hover{transform:translateY(-2px);box-shadow:0 8px 30px #e1b87350}.draw:active{transform:scale(.98)}.reset{border:1px solid var(--line);background:#ffffff08;color:var(--muted);padding:11px 17px;border-radius:999px;cursor:pointer}.reset:hover{border-color:#f2cf8780;color:var(--ink)}.hint{font-size:13px;color:#a69bb8;margin:20px 0 0}.result{min-height:32px;margin:12px 0 0;color:#f5daa2;font-weight:700;letter-spacing:.08em}.foot{border-top:1px solid var(--line);color:#8f879e;font-size:12px;text-align:center;padding:17px 0 24px}.toast{position:fixed;inset:auto 16px 24px;display:flex;justify-content:center;pointer-events:none}.toast span{background:#242034;border:1px solid #f2cf8755;padding:9px 16px;border-radius:99px;color:var(--ink);opacity:0;transform:translateY(8px);transition:.25s}.toast.show span{opacity:1;transform:translateY(0)}@media(max-width:600px){.wrap{width:calc(100% - 24px)}main{padding-top:34px}.arena{height:440px}.card{width:105px;height:165px}.halo{height:210px;bottom:42px}.controls{margin-top:0}.draw{padding:12px 22px}.reset{padding:10px 13px}.hint{font-size:12px}}
</style>
</head>
<body><div class="wrap"><header class="top"><a class="brand" href="index.html">PIXEL <i>STUDIO</i></a><a class="back" href="index.html">← 回作品集</a></header><main><div class="eyebrow">Arcana · Interactive demo</div><h1>月蝕牌室</h1><p class="sub">在星月之間，抽出屬於你的命運牌</p><div class="arena" id="arena" aria-label="可拖曳旋轉的卡牌扇形區"><div class="halo"></div><span class="star s1">✦</span><span class="star s2">✧</span><span class="star s3">✦</span><div class="cards" id="cards"></div></div><div class="controls"><button class="draw" id="draw">✦　抽一張　✦</button><button class="reset" id="reset">重新洗牌</button></div><p class="hint">滑鼠移到卡牌上預覽　・　拖曳或滑動牌陣旋轉　・　滾輪也能轉牌</p><p class="result" id="result" aria-live="polite"></p></main><footer class="foot">互動原型｜卡牌內容僅供試玩</footer></div><div class="toast" id="toast"><span>牌陣已旋轉</span></div>
<script>
const deck=[{name:"星辰",symbol:"✦",glow:"#b9a1df"},{name:"月影",symbol:"☾",glow:"#9eb8df"},{name:"太陽",symbol:"☼",glow:"#eccb82"},{name:"命運之輪",symbol:"◉",glow:"#d8a28b"},{name:"戀人",symbol:"♡",glow:"#e9a2b8"},{name:"女祭司",symbol:"☽",glow:"#a9b6dc"},{name:"世界",symbol:"◎",glow:"#9dc8ad"},{name:"魔術師",symbol:"✧",glow:"#d4a5d9"},{name:"力量",symbol:"♌",glow:"#e3b27c"},{name:"愚者",symbol:"☆",glow:"#9fd0d0"},{name:"節制",symbol:"⚖",glow:"#c1acd8"},{name:"隱者",symbol:"♙",glow:"#adb5c9"},{name:"星星",symbol:"❋",glow:"#98bddd"},{name:"審判",symbol:"♬",glow:"#ddb88f"},{name:"皇后",symbol:"❀",glow:"#e7a6b2"}];
const root=document.querySelector('#cards'),arena=document.querySelector('#arena'),result=document.querySelector('#result');let active=0,dragX=null,dragMoved=false,step=0;const cards=[];const n=deck.length;
function signed(i){let d=(i-active+n)%n;if(d>n/2)d-=n;return d}
function layout(animate=true){const w=arena.clientWidth,h=arena.clientHeight;const cardH=window.innerWidth<=600?165:Math.min(226,Math.max(176,w*.21));const radius=Math.min(w*.71,455);cards.forEach((el,i)=>{const d=signed(i);const visible=Math.abs(d)<=6;const angle=d*9.3;const x=radius*Math.sin(angle*Math.PI/180);const y=h-32-cardH-radius*(1-Math.cos(angle*Math.PI/180));el.style.left=`calc(50% + ${x}px)`;el.style.top=`${y}px`;el.style.transform=`translateX(-50%) rotate(${angle}deg)`;el.style.opacity=visible?'1':'0';el.style.pointerEvents=visible?'auto':'none';el.style.zIndex=String(30-Math.abs(d));el.style.transitionDuration=animate?'.42s':'0s';});}
deck.forEach((item,i)=>{const el=document.createElement('button');el.className='card';el.setAttribute('aria-label','神秘卡牌 '+(i+1));el.innerHTML=`<span class="card-inner"><span class="back-design"><span class="moon"></span><span class="sigil">LUNAR ARCANA</span></span><span class="face" style="--glow:${item.glow}"><span class="symbol">${item.symbol}</span><strong>${item.name}</strong></span></span>`;el.addEventListener('click',()=>{if(dragMoved){dragMoved=false;return}reveal(i)});cards.push(el);root.append(el)});
function reveal(i){if(cards[i].classList.contains('revealed')){cards[i].classList.toggle('picked');return}cards.forEach(c=>c.classList.remove('picked'));cards[i].classList.add('revealed','picked');result.textContent=`你抽到了「${deck[i].name}」`;}
function rotate(amount){active=(active+amount+n)%n;layout();result.textContent='';}
arena.addEventListener('pointerdown',e=>{dragX=e.clientX;dragMoved=false;arena.classList.add('dragging');arena.setPointerCapture(e.pointerId)});
arena.addEventListener('pointermove',e=>{if(dragX===null)return;const delta=e.clientX-dragX;if(Math.abs(delta)>5)dragMoved=true;if(Math.abs(delta)>34){const count=Math.trunc(delta/34);rotate(-count);dragX-=count*34}});
function endDrag(){dragX=null;arena.classList.remove('dragging')}arena.addEventListener('pointerup',endDrag);arena.addEventListener('pointercancel',endDrag);
arena.addEventListener('wheel',e=>{e.preventDefault();const d=Math.abs(e.deltaY)>Math.abs(e.deltaX)?e.deltaY:e.deltaX;step+=d;if(Math.abs(step)>18){const count=Math.trunc(step/18);rotate(count);step-=count*18}},{passive:false});
document.querySelector('#draw').addEventListener('click',()=>{const candidates=deck.map((_,i)=>i).filter(i=>!cards[i].classList.contains('revealed'));if(!candidates.length){result.textContent='這一輪的牌都已翻開，重新洗牌再試一次';return}const i=candidates[Math.floor(Math.random()*candidates.length)];active=i;layout();setTimeout(()=>reveal(i),190)});
document.querySelector('#reset').addEventListener('click',()=>{cards.forEach(c=>c.classList.remove('revealed','picked'));active=Math.floor(Math.random()*n);layout();result.textContent='牌已洗好，請抽牌';});window.addEventListener('resize',()=>layout(false));layout(false);
</script></body></html>
